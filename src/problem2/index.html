<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fancy Form</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- shortcut: Play CDN compiles in the browser, fine for a demo; switch to @tailwindcss/vite for production. -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.13"></script>
  <style type="text/tailwindcss">
    @theme { --font-sans: Inter, ui-sans-serif, system-ui, sans-serif; }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 font-sans text-slate-100 bg-[#0b0d17] bg-[radial-gradient(40rem_30rem_at_15%_10%,rgba(124,92,255,.25),transparent_60%),radial-gradient(35rem_30rem_at_90%_90%,rgba(25,211,197,.18),transparent_60%)] [color-scheme:dark]">
  <form id="swap-form" novalidate
    class="w-full max-w-[440px] p-5 rounded-3xl border border-white/10 bg-[#161a2b]/80 backdrop-blur-xl shadow-[0_30px_80px_rgba(0,0,0,.45)]">
    <h1 class="mx-1 mb-4 text-xl font-semibold">Swap</h1>

    <div class="p-4 rounded-2xl border border-transparent bg-[#12152a] hover:bg-[#171b33] focus-within:border-violet-500/50 transition">
      <label for="input-amount" class="text-sm text-slate-400">You send</label>
      <div class="flex items-center gap-3 mt-2 mb-1">
        <input id="input-amount" inputmode="decimal" autocomplete="off" placeholder="0" aria-describedby="error"
          class="flex-1 min-w-0 bg-transparent text-3xl font-semibold outline-none placeholder:text-slate-600" />
        <button type="button" data-side="from" aria-haspopup="dialog"
          class="token-btn flex shrink-0 items-center gap-2 py-1.5 pl-1.5 pr-2.5 rounded-full border border-white/10 bg-white/5 hover:bg-white/10 font-semibold cursor-pointer transition focus-visible:outline-2 focus-visible:outline-violet-500"></button>
      </div>
      <span id="from-usd" class="block min-h-5 text-sm text-slate-400"></span>
    </div>

    <button type="button" id="flip" aria-label="Switch tokens"
      class="relative z-10 grid place-items-center size-10 -my-[18px] mx-auto rounded-xl border-4 border-[#161a2b] bg-[#171b33] hover:bg-[#20254a] hover:rotate-180 transition duration-300 cursor-pointer motion-reduce:transition-none focus-visible:outline-2 focus-visible:outline-violet-500">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M7 4v13m0 0-3-3m3 3 3-3M17 20V7m0 0-3 3m3-3 3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div class="mt-1 p-4 rounded-2xl border border-transparent bg-[#12152a] hover:bg-[#171b33] focus-within:border-violet-500/50 transition">
      <label for="output-amount" class="text-sm text-slate-400">You receive</label>
      <div class="flex items-center gap-3 mt-2 mb-1">
        <input id="output-amount" inputmode="decimal" autocomplete="off" placeholder="0"
          class="flex-1 min-w-0 bg-transparent text-3xl font-semibold outline-none placeholder:text-slate-600" />
        <button type="button" data-side="to" aria-haspopup="dialog"
          class="token-btn flex shrink-0 items-center gap-2 py-1.5 pl-1.5 pr-2.5 rounded-full border border-white/10 bg-white/5 hover:bg-white/10 font-semibold cursor-pointer transition focus-visible:outline-2 focus-visible:outline-violet-500"></button>
      </div>
      <span id="to-usd" class="block min-h-5 text-sm text-slate-400"></span>
    </div>

    <p id="rate" class="min-h-5 mt-3.5 mx-1 text-sm text-slate-400"></p>
    <p id="error" role="alert" class="min-h-5 mt-1 mb-3 mx-1 text-sm text-rose-400"></p>

    <button type="submit" id="submit"
      class="w-full p-4 rounded-2xl text-lg font-semibold cursor-pointer bg-linear-135 from-violet-500 via-blue-500 to-teal-400 hover:brightness-110 active:scale-[.99] transition disabled:cursor-not-allowed disabled:bg-none disabled:bg-[#232842] disabled:text-slate-400 disabled:hover:brightness-100 disabled:active:scale-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-violet-500">Confirm swap</button>
  </form>

  <dialog id="picker"
    class="m-auto w-[min(400px,calc(100vw-32px))] max-h-[min(600px,calc(100vh-32px))] open:flex flex-col rounded-[20px] border border-white/10 bg-[#151930] text-slate-100 backdrop:bg-[#05060f]/60 backdrop:backdrop-blur-sm">
    <div class="flex items-center justify-between pt-4 pr-4 pb-2 pl-5">
      <h2 class="text-base font-semibold">Select a token</h2>
      <button type="button" aria-label="Close" onclick="this.closest('dialog').close()"
        class="size-8 rounded-lg text-2xl text-slate-400 hover:bg-white/10 hover:text-slate-100 cursor-pointer">×</button>
    </div>
    <input id="search" type="search" placeholder="Search name" autocomplete="off"
      class="mx-4 mt-1 mb-3 px-3.5 py-3 rounded-xl border border-white/10 bg-[#12152a] outline-none focus:border-violet-500" />
    <ul id="token-list" role="listbox" class="px-2 pb-2 overflow-y-auto"></ul>
  </dialog>

  <div id="toast" role="status"
    class="fixed bottom-6 left-1/2 -translate-x-1/2 translate-y-5 max-w-[calc(100vw-32px)] px-4 py-3 rounded-2xl border border-teal-400/40 bg-[#102a2c] text-sm opacity-0 pointer-events-none transition duration-200"></div>

  <script type="module" src="script.js"></script>
</body>

</html>
